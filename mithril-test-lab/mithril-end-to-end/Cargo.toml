[package]
name = "mithril-end-to-end"
version = "0.5.13"
authors = { workspace = true }
edition = { workspace = true }
documentation = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
default-run = "mithril-end-to-end"

[[bin]]
name = "load-aggregator"
test = false
bench = false

[features]
default = ["rustls"]
allow_skip_signer_certification = []
future_snark = ["mithril-common/future_snark"]
rustls = ["mithril-common/rustls", "reqwest/rustls"]

[dependencies]
anyhow = { workspace = true }
async-recursion = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
indicatif = { version = "0.18.6", features = ["tokio"] }
mithril-cardano-node-chain = { path = "../../internal/cardano-node/mithril-cardano-node-chain" }
mithril-cardano-node-internal-database = { path = "../../internal/cardano-node/mithril-cardano-node-internal-database" }
mithril-common = { path = "../../mithril-common" }
mithril-doc = { path = "../../internal/mithril-doc" }
pallas-hardano = { version = "1.1.1" }
pallas-traverse = { version = "1.1.1" }
rand = { version = "0.10.2" }
reqwest = { workspace = true, features = ["charset", "http2", "system-proxy"] }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slog = { workspace = true, features = ["max_level_trace", "release_max_level_trace"] }
slog-async = { workspace = true }
slog-scope = "4.4.1"
slog-term = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "signal", "time"] }

[package]
name = "mithril-cardano-node-chain"
version = "0.1.34"
authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
include = [
    "**/*.rs",
    "Cargo.toml",
    "README.md",
    ".gitignore",
    "tests/assets/shelley1.block",
    "tests/assets/dijkstra1.block",
    "tests/assets/dijkstra2.block",
]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
mithril-common = { path = "../../../mithril-common" }
nom = "8.0.0"
pallas-addresses = { git = "https://github.com/jpraynaud/pallas.git", rev = "c6c584163e9f3f67c56d9496fd19f6b90ef74daf" }
pallas-codec = { git = "https://github.com/jpraynaud/pallas.git", rev = "c6c584163e9f3f67c56d9496fd19f6b90ef74daf" }
pallas-network = { git = "https://github.com/jpraynaud/pallas.git", rev = "c6c584163e9f3f67c56d9496fd19f6b90ef74daf" }
pallas-primitives = { git = "https://github.com/jpraynaud/pallas.git", rev = "c6c584163e9f3f67c56d9496fd19f6b90ef74daf" }
pallas-traverse = { git = "https://github.com/jpraynaud/pallas.git", rev = "c6c584163e9f3f67c56d9496fd19f6b90ef74daf", features = ["unstable"] }
rand_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slog = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
kes-summed-ed25519 = { version = "0.2.1", features = ["serde_enabled", "sk_clone_enabled"] }
mockall = { workspace = true }
pallas-crypto = { git = "https://github.com/jpraynaud/pallas.git", rev = "c6c584163e9f3f67c56d9496fd19f6b90ef74daf" }
slog-async = { workspace = true }
slog-term = { workspace = true }
tokio = { workspace = true, features = ["macros", "test-util"] }

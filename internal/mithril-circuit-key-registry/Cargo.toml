[package]
name = "mithril-circuit-key-registry"
description = "Genesis-signed registry of the circuit verification keys trusted for Mithril SNARK certificates."
version = "0.2.0"
authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
include = ["**/*.rs", "Cargo.toml", "README.md", ".gitignore"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["snark"]
# Enables the registry, which requires the SNARK implementation of the `mithril-common` dependency
snark = [
    "dep:anyhow",
    "dep:async-trait",
    "dep:chrono",
    "dep:futures",
    "mithril-common/snark",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:slog",
    "dep:thiserror",
    "dep:tokio",
]

# TLS backend of the registry download
# Exactly one of these must be enabled
native-tls = ["reqwest?/native-tls"]
rustls = ["reqwest?/rustls"]

[dependencies]
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
futures = { version = "0.3.34", optional = true }
mithril-common = { path = "../../mithril-common", version = "0.9.0", optional = true }
reqwest = { workspace = true, features = ["stream"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
slog = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
hex = { workspace = true }
httpmock = "0.8.3"
mockall = { workspace = true }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
slog-async = { workspace = true }
slog-term = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

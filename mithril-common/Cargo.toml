[package]
name = "mithril-common"
version = "0.7.16"
description = "Common types, interfaces, and utilities for Mithril nodes."
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
include = ["**/*.rs", "Cargo.toml", "README.md", ".gitignore", "openapi.yaml"]

[package.metadata.docs.rs]
all-features = true
# enable unstable features in the documentation
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-machete]
# `serde_bytes` is used for OpCert serialization
ignored = ["serde_bytes"]

[features]
default = ["num-integer-backend"]

# Enables `rug-backend` features for `mithril-stm` dependency
rug-backend = ["mithril-stm/rug-backend"]
# Enables `num-integer-backend` features for `mithril-stm` dependency
num-integer-backend = ["mithril-stm/num-integer-backend"]

# Disable signer certification, to be used only for tests
allow_skip_signer_certification = []

# Enables the future SNARK implementation for the `mithril-stm` dependency
future_snark = ["mithril-stm/future_snark"]

# Enables the TLS features for the `mithril-stm` dependency
# Exactly one of these must be enabled together with `future_snark`
native-tls = ["mithril-stm/native-tls"]
rustls = ["mithril-stm/rustls"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bech32 = "0.12.0"
bincode = { version = "=2.0.1", features = ["serde"] }
blake2 = "0.10.6"
chrono = { workspace = true }
ciborium = "0.2.2"
digest = { workspace = true }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
fixed = "1.31.0"
hex = { workspace = true }
kes-summed-ed25519 = { version = "0.2.1", features = ["serde_enabled", "sk_clone_enabled"] }
mithril-merkle-tree = { path = "../internal/mithril-merkle-tree", version = "0.1.4" }
mithril-stm = { path = "../mithril-stm", version = "0.12.2", default-features = false }
nom = "8.0.0"
rand_chacha = { workspace = true }
rand_core = { workspace = true }
rayon = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_bytes = "0.11.19"
serde_json = { workspace = true }
serde_with = "3.21.0"
sha2 = "0.10.9"
slog = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
typetag = "0.2.22"
walkdir = "2.5.0"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.126"

[build-dependencies]
mithril-build-script = { path = "../internal/mithril-build-script", version = "0.2.34" }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }
mockall = { workspace = true }
slog-async = { workspace = true }
slog-term = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[bench]]
name = "block_range"
harness = false

[advisories]
yanked = "deny"
unmaintained = "all"
ignore = [
    # bincode is used directly by mithril-common (`SignedEntityType` bytes) and mithril-merkle-tree (`MKProof` and `MKMapProof` bytes), and by tests of mithril-dmq.
    # It also comes through midnight-zk-stdlib (`snark` feature), whose latest release still depends on it.
    # To do: replace our usages with a byte-identical encoding, then bump midnight-zk-stdlib once it drops bincode.
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained, used directly and through midnight-zk-stdlib" },
    # paste is no longer a direct dependency, it comes through midnight-curves, binary-layout (pallas-hardano), netlink-packet-core and pallas-traverse.
    # To do: remove once these crates move to a maintained alternative such as pastey.
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, only used by third party dependencies" },
]

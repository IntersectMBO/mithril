name: Weekly Dispatcher

on:
  workflow_dispatch:
  # Important note about scheduled workflows:
  # Notifications for scheduled workflows are sent to the user who last modified the cron syntax in the workflow file.
  schedule:
    - cron: "0 1 * * 1"

jobs:
  check-crates-advisories-full:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        id: deny
        with:
          command: check advisories
          arguments: "--all-features --config .config/deny-full.toml"
          command-arguments: "--warn advisory-ignored --warn vulnerability --warn unsound"
          log-level: warn

      - name: Explain result
        if: always() && steps.deny.outcome != 'skipped'
        run: |
          {
            echo "## Crates advisories (full check)"
            echo ""
            if [ "${{ steps.deny.outcome }}" = "failure" ]; then
              echo "**Yanked or unmaintained crates found.**"
              echo ""
              echo "Yanked crates:"
              echo "- Direct dependency of Mithril: open a fix PR with \`cargo update -p <package> [--precise <version>]\`."
              echo "- Not a direct dependency: try \`cargo update -p <package>\` first; if a parent crate's version constraint blocks the update, wait for an upstream fix."
              echo ""
              echo "Unmaintained crates:"
              echo "- Direct dependency of Mithril: open an issue to replace it."
              echo "- Not a direct dependency: add an ignore entry with an explanation to \`.config/deny-full.toml\` until the parent crate replaces it."
            else
              echo "No new yanked or unmaintained crates found ✅"
            fi
            echo ""
            echo "Vulnerabilities and unsound crates are reported as warnings in the job log:"
            echo "- Fixable with \`cargo update -p <package> [--precise <version>]\` or a dependency upgrade: open a fix PR."
            echo "- No upstream fix available: keep the warning until a fixed release is reachable."
          } >> "$GITHUB_STEP_SUMMARY"

  notify-on-failure:
    uses: ./.github/workflows/test-notify-on-failure.yml
    needs: [check-crates-advisories-full]
    if: failure()
    secrets: inherit

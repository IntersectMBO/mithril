[package]
name = "mithril-client-wasm"
version = "0.10.8"
description = "Mithril client WASM"
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
categories = ["cryptography"]

[package.metadata.docs.rs]
all-features = true
# enable unstable features in the documentation
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-machete]
# wasm-bindgen-futures is required to build the project, but it's not used in the code
ignored = ["wasm-bindgen-futures"]

[lib]
crate-type = ["cdylib"]

[features]
default = ["rustls", "future_snark"]
rustls = ["mithril-client/rustls"]
test-node = []
future_snark = ["mithril-client/future_snark"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
mithril-client = { path = "../mithril-client", default-features = false, features = ["unstable"] }
serde = { workspace = true }
serde-wasm-bindgen = "0.6.5"
serde_json = { workspace = true }
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = ["BroadcastChannel", "console", "Storage", "Window"] }

[target.'cfg(all(target_family = "wasm"))'.dependencies]
# This getrandom version is required without the future_snark feature, and it can be removed once the future_snark feature is enabled.
getrandom = { version = "0.2", features = ["js"] }
# This getrandom version is required with the future_snark feature (because of Midnight ZK dependency)
getrandom-future-snark = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }

[build-dependencies]
mithril-build-script = { path = "../internal/mithril-build-script" }

[dev-dependencies]
wasm-bindgen-test = "0.3.76"
